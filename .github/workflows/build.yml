name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate release notes
        run: |
          npx auto-changelog-plus --starting-version ${{ github.ref_name }}
          sed -i '1,4d' CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          # archive 为 false 时 artifact 名取自文件名，因此下游按 CHANGELOG.md 下载
          # 文件缺失说明 changelog 生成失败，直接报错而不是让后续每个平台各自失败
          #
          # With archive false the artifact name comes from the filename, so downstream downloads it as CHANGELOG.md
          # A missing file means changelog generation failed, so fail here instead of failing later in every platform job
          path: CHANGELOG.md
          archive: false
          if-no-files-found: error

  build:
    runs-on: ${{ matrix.os }}
    needs: changelog
    if: always() && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Windows =====
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: .exe

          # ===== Linux =====
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: "7"
            platform: linux-armv7
            ext: ""
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++

          # ===== macOS =====
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: src/go.mod

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.goarch }}" in
            arm64|arm)
              if [ "${{ matrix.goarch }}" = "arm64" ]; then
                DEB_ARCH=arm64
                CROSS_CC="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
              else
                DEB_ARCH=armhf
                CROSS_CC="gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
              fi

              sudo sed -i 's/^deb /deb [arch=amd64] /g; s/^deb-src /deb-src [arch=amd64] /g' /etc/apt/sources.list

              CODE=$(lsb_release -cs)
              for suite in "$CODE" "$CODE-updates" "$CODE-security"; do
                echo "deb [arch=${DEB_ARCH}] http://ports.ubuntu.com/ubuntu-ports/ ${suite} main restricted universe multiverse" \
                  | sudo tee -a /etc/apt/sources.list
              done

              sudo dpkg --add-architecture "$DEB_ARCH"
              sudo apt-get update -q
              sudo apt-get install -y \
                libasound2-dev \
                libasound2-dev:"$DEB_ARCH" \
                gcc g++ \
                $CROSS_CC
              ;;
            *)
              sudo apt-get update -q
              sudo apt-get install -y libasound2-dev gcc g++
              ;;
          esac

      - name: Vulnerability scan
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        working-directory: src
        shell: bash
        run: |
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          [ -n "${{ matrix.goarm }}" ] && export GOARM=${{ matrix.goarm }}

          [ -n "${{ matrix.cc }}" ]  && export CC=${{ matrix.cc }}
          [ -n "${{ matrix.cxx }}" ] && export CXX=${{ matrix.cxx }}

          go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o ../dist/midibridge-client${{ matrix.ext }} \
            .

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          mv dist/midibridge-client${{ matrix.ext }} \
             dist/MIDIBridge-Client-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: CHANGELOG.md

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/MIDIBridge-Client-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    # 等全部平台产物上传完成后生成清单，平台失败时仍执行，缺失平台记入 warnings
    #
    # Runs after every platform artifact is uploaded, keeps running when a platform fails, and records missing platforms under warnings
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} not found; manifest cannot be generated"
            exit 1
          fi
          # 产物是裸二进制，Windows 带 .exe 其他平台无后缀，因此按文件名前缀下载而不是按后缀
          #
          # Artifacts are bare binaries with .exe only on Windows, so they are fetched by filename prefix rather than by suffix
          gh release download "${GITHUB_REF_NAME}" --pattern 'MIDIBridge-Client-*' --dir assets
          ls -l assets

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev gcc g++

      - name: Generate version.json
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          (cd src && go build -o /tmp/midibridge-client .)
          IPC_PROTO="$(/tmp/midibridge-client --ipc-protocol)"
          python3 .github/scripts/gen_version_manifest.py \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --ipc-protocol "${IPC_PROTO}" \
            --assets-dir assets \
            --out version.json
          cat version.json

      - name: Upload manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只追加单个文件，不触碰既有 asset，避免与 matrix 的并发上传冲突
          # Upload the single file only, leaving existing assets untouched and avoiding the concurrent writes done by the matrix
          gh release upload "${GITHUB_REF_NAME}" version.json --clobber

