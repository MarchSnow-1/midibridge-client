name: Build Dev

on:
  push:
    branches:
      - main

jobs:
  check:
    # 构建前的一次性检查，当前为漏洞扫描
    # 扫描只依赖源码与依赖树，与目标平台无关，因此在这里跑一次而不是在矩阵里跑六次
    # 失败会阻断 build，从而不会产出未扫描的产物
    #
    # The one-off checks before a build, currently the vulnerability scan
    # The scan depends only on the source and the dependency tree, not on the target platform, so it runs once here instead of six times in the matrix
    # A failure blocks build, so no artifact is produced without a passing scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          # 缓存键取 src/go.sum，否则 setup-go 在仓库根找不到依赖文件而跳过缓存
          #
          # The cache key reads src/go.sum, otherwise setup-go finds no dependency file at the repository root and skips the cache
          cache-dependency-path: src/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev gcc g++

      - name: Run govulncheck
        working-directory: src
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    needs: check
    if: always() && needs.check.result == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Windows =====
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: .exe

          # ===== Linux =====
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: "7"
            platform: linux-armv7
            ext: ""
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++

          # ===== macOS =====
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: src/go.mod

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.goarch }}" in
            arm64|arm)
              if [ "${{ matrix.goarch }}" = "arm64" ]; then
                DEB_ARCH=arm64
                CROSS_CC="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
              else
                DEB_ARCH=armhf
                CROSS_CC="gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
              fi

              sudo sed -i 's/^deb /deb [arch=amd64] /g; s/^deb-src /deb-src [arch=amd64] /g' /etc/apt/sources.list

              CODE=$(lsb_release -cs)
              for suite in "$CODE" "$CODE-updates" "$CODE-security"; do
                echo "deb [arch=${DEB_ARCH}] http://ports.ubuntu.com/ubuntu-ports/ ${suite} main restricted universe multiverse" \
                  | sudo tee -a /etc/apt/sources.list
              done

              sudo dpkg --add-architecture "$DEB_ARCH"
              sudo apt-get update -q
              sudo apt-get install -y \
                libasound2-dev \
                libasound2-dev:"$DEB_ARCH" \
                gcc g++ \
                $CROSS_CC
              ;;
            *)
              sudo apt-get update -q
              sudo apt-get install -y libasound2-dev gcc g++
              ;;
          esac

      - name: Compute version
        id: version
        shell: bash
        run: |
          RAW=$(git describe --tags --always --long 2>/dev/null || echo "")
          if echo "$RAW" | grep -Eq '^.+-[0-9]+-g[a-f0-9]+$'; then
            VER=$(echo "$RAW" | sed -E 's/^(.+)-([0-9]+)-(g[a-f0-9]+)$/\1-beta\2-\3/')
          elif echo "$RAW" | grep -Eq '^[a-f0-9]+$'; then
            VER="0.0.0-beta0-g${RAW}"
          else
            VER="$RAW"
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VER}"

      - name: Build
        working-directory: src
        shell: bash
        run: |
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          [ -n "${{ matrix.goarm }}" ] && export GOARM=${{ matrix.goarm }}

          [ -n "${{ matrix.cc }}" ]  && export CC=${{ matrix.cc }}
          [ -n "${{ matrix.cxx }}" ] && export CXX=${{ matrix.cxx }}

          go build \
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o ../dist/midibridge-client${{ matrix.ext }} \
            .

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          mv dist/midibridge-client${{ matrix.ext }} \
             dist/MIDIBridge-Client-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # 直传裸二进制，archive 为 false 时 artifact 名取自文件名，忽略 name
          # 因此下游按 MIDIBridge-Client-<version>-<platform> 取到的就是可执行文件本身，没有额外的 zip 层
          #
          # Upload the bare binary directly, since archive false takes the artifact name from the filename and ignores name
          # A downstream fetch of MIDIBridge-Client-<version>-<platform> therefore yields the executable itself without an extra zip layer
          path: dist/MIDIBridge-Client-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}
          archive: false
          if-no-files-found: error

  manifest:
    # dev 不发布 Release，清单作为 artifact 上传，平台失败时仍执行，缺失平台记入 warnings
    #
    # Dev builds publish no release, so the manifest is uploaded as an artifact, keeps running when a platform fails, and records missing platforms under warnings
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          RAW=$(git describe --tags --always --long 2>/dev/null || echo "")
          if echo "$RAW" | grep -Eq '^.+-[0-9]+-g[a-f0-9]+$'; then
            VER=$(echo "$RAW" | sed -E 's/^(.+)-([0-9]+)-(g[a-f0-9]+)$/\1-beta\2-\3/')
          elif echo "$RAW" | grep -Eq '^[a-f0-9]+$'; then
            VER="0.0.0-beta0-g${RAW}"
          else
            VER="$RAW"
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VER}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
          pattern: MIDIBridge-Client-*-*

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev gcc g++

      - name: Generate version.json
        shell: bash
        run: |
          set -euo pipefail
          ls -l assets
          export CGO_ENABLED=1
          (cd src && go build -o /tmp/midibridge-client .)
          IPC_PROTO="$(/tmp/midibridge-client --ipc-protocol)"
          python3 .github/scripts/gen_version_manifest.py \
            --channel dev \
            --version "${{ steps.version.outputs.VERSION }}" \
            --ipc-protocol "${IPC_PROTO}" \
            --assets-dir assets \
            --out version.json
          cat version.json

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          # artifact 名取自文件名，即 version.json，固定不随版本号变化
          # 直传让下游从 run 页面拿到的就是 JSON 本身，不用再解一层 zip
          #
          # The artifact name comes from the filename, so it is the fixed version.json rather than one that changes with the build
          # Uploading directly gives downstream a bare JSON from the run page instead of another zip to unwrap
          path: version.json
          archive: false
          overwrite: true
          if-no-files-found: error

